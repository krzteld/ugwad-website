<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders & Order Tracking | UGWAD</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">UGWAD</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="learn.html">Learn to Weave</a>
      <a href="shop.html">Shop</a>
      <a href="my-orders.html">My Orders</a>
    </nav> 
  </header>

  <main class="container" style="padding: 2rem 1rem;">
    <h1>Track & Manage Orders</h1>
    <p>Search your Order Code to check weaving progress, or filter by status (UGWAD Officers).</p>

    <!-- Search and Filter Controls -->
    <div class="filter-bar" style="display: flex; gap: 10px; flex-wrap: wrap; margin: 1.5rem 0;">
      <input 
        type="text" 
        id="orderSearchInput" 
        placeholder="Enter Order Code (e.g., UGWAD-101) or Name..." 
        style="flex: 2; padding: 10px;"
      >
      <select id="statusFilter" style="flex: 1; padding: 10px;">
        <option value="All">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="Confirmed">Confirmed</option>
        <option value="In-Progress">In-Progress</option>
        <option value="Shipped/Ready">Shipped/Ready</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <button id="searchBtn" class="btn">Search</button>
    </div>

    
    <div id="ordersList">
      <p>Loading orders...</p>
    </div>
  </main>

    <footer class="footer">
    <p>&copy; 2026 UGWAD Weaving Collective | Iloilo, Philippines</p>
  </footer>


  <!-- Scripts in exact required order -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/orders.js"></script>

</body>
</html>
